name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout virtual-gruenfeld
        uses: actions/checkout@v4
        with:
          path: virtual-gruenfeld

      - name: Checkout mpm-ts
        uses: actions/checkout@v4
        with:
          repository: pfefferniels/mpm-ts
          path: mpm-ts

      - name: Checkout mpmify
        uses: actions/checkout@v4
        with:
          repository: pfefferniels/mpmify
          path: mpmify

      - name: Checkout react-pianosound
        uses: actions/checkout@v4
        with:
          repository: pfefferniels/react-pianosound
          path: react-pianosound

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build mpm-ts
        working-directory: mpm-ts
        run: npm ci && npm run build

      - name: Build mpmify
        working-directory: mpmify
        run: npm ci && npm run build

      - name: Install react-pianosound deps
        working-directory: react-pianosound
        run: npm ci

      - name: Install root dependencies
        working-directory: virtual-gruenfeld
        run: npm ci

      # The AI teacher is baked into the client bundle at build time, so it is
      # configured here rather than at runtime. Nothing is enabled by default:
      # with no repository variables set, the deployed app keeps today's
      # behaviour (exaggerated counter-performance, nobody talking).
      #
      # To turn it on, deploy the Node teacher service behind HTTPS and define
      # the repository variable TEACHER_URL. Full instructions: DEPLOYMENT.md.
      #
      # Only non-empty variables are exported, because Vite lets process.env
      # win over client/.env.production — an empty one would blank out a URL
      # configured in that file.
      - name: Configure the AI teacher for the build
        env:
          TEACHER_URL: ${{ vars.TEACHER_URL }}
          TEACHER_AGENTIC: ${{ vars.TEACHER_AGENTIC }}
          TEACHER_VOICE: ${{ vars.TEACHER_VOICE }}
        run: |
          if [ -n "$TEACHER_URL" ]; then echo "VITE_TEACHER_URL=$TEACHER_URL" >> "$GITHUB_ENV"; fi
          if [ -n "$TEACHER_AGENTIC" ]; then echo "VITE_TEACHER_AGENTIC=$TEACHER_AGENTIC" >> "$GITHUB_ENV"; fi
          if [ -n "$TEACHER_VOICE" ]; then echo "VITE_TEACHER_VOICE=$TEACHER_VOICE" >> "$GITHUB_ENV"; fi

      - name: Install and build client
        working-directory: virtual-gruenfeld/client
        env:
          VITE_API_URL: https://api.welte225.org
        run: npm ci && npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=virtual-gruenfeld
          workingDirectory: virtual-gruenfeld/client
